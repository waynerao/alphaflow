[project]
name            = "alphaflow"
version         = "0.1.0"
description     = "Alpha research, calculation and post-trade reconciliation platform"
requires-python = ">=3.11"

# apcr_desktool is the on-prem integration package (kdb+, Bloomberg, BBL<->RIC mapping, auth).
# It is NOT on PyPI, so it is deliberately absent from this list - a declared dependency on it
# would make the lock file unresolvable off-prem. Install it on-prem with
#     uv pip install -e ../apcr_desktool
# and switch the adapter on with ALPHAFLOW_DESKTOOL=real.
# See src/alphaflow/core/integrations/desktool_adapter.py.
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "boto3",
    "pydantic>=2.7",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaflow"]

[dependency-groups]
dev = [
    "pytest>=8.2", "pytest-cov>=5.0", "pytest-mock>=3.14",
    "ipykernel>=6.0", "jupyterlab>=4.0", "ruff>=0.6",
]

# On-prem: uncomment to pin the internal package to its local checkout.
# [tool.uv.sources]
# apcr-desktool = { path = "../apcr_desktool", editable = true }

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src         = ["src"]
line-length = 149

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]
