# Template for a MidAlpha (fixed-interval intraday). No concrete mid alpha exists yet -
# extend MidAlphaConfig when the first one needs more than an interval.

[identity]
name          = "my_mid_alpha"
description   = "One line on what the signal captures"
category      = "intraday"
tags          = []
formula       = "Plain-language or pseudo-code statement of the calculation"
handler_class = "alphaflow.signal_builder.alphas.mid.my_mid_alpha.MyMidAlpha"
alpha_type    = "mid"
market_scope  = ["HK"]

[data]
required_inputs   = ["minute_bar"]
custom_exclusions = []

[params]
interval_minutes = 5
